# ==============================================================================
# 1. CORE PERFORMANCE & TRUE COLOR
# ==============================================================================
# Match Neovim 24-bit True Color and 256 colors
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Change prefix key to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Quality of Life (Mouse DISABLED)
set -g mouse off
set -g history-limit 10000    # Scrollback buffer
set -s escape-time 0          # Instant Escape key processing for Vim/Neovim
set -g focus-events on        # Pass focus events to Neovim
set -g set-clipboard on       # OS clipboard integration

# Index windows and panes starting at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on    # Renumber sequentially when closing windows

# Reload configuration with 'Prefix + r'
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ==============================================================================
# 2. VIM PANE NAVIGATION & SPLITS
# ==============================================================================
# Intuitive Splits (inherits current working directory)
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Navigate panes with Prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes without Prefix using Alt + h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Switch Windows directly with Alt + 1-9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resize panes with Prefix + Shift + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Zoom focused pane toggle (Prefix + z)
bind z resize-pane -Z

# Toggle Synchronize Panes (type in all panes at once)
bind y set-window-option synchronize-panes\; display-message "Sync panes toggled!"

# ==============================================================================
# 3. USEFUL CONVENIENCES (SCRATCHPAD OVERLAY)
# ==============================================================================
# Toggle floating terminal scratchpad overlay (Prefix + p)
bind p display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# ==============================================================================
# 4. VIM COPY-MODE
# ==============================================================================
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ==============================================================================
# 5. MINIMAL STATUS BAR & COLORS
# ==============================================================================
set -g status "on"
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0d0d0d,fg=#999999"

# Border styling
set -g pane-border-style "fg=#1c1c1c"
set -g pane-active-border-style "fg=#e53935"

# Left Status (Session Name)
set -g status-left-length "50"
set -g status-left "#[fg=#000000,bg=#e53935,bold] #S #[bg=#0d0d0d] "

# Right Status (Hostname)
set -g status-right-length "80"
set -g status-right "#[fg=#ffffff,bg=#1c1c1c] #H "

# Window Tabs
setw -g window-status-style "fg=#666666,bg=#0d0d0d"
setw -g window-status-format "#[fg=#666666,bg=#0d0d0d] #I:#W "
setw -g window-status-current-style "fg=#ffffff,bg=#1c1c1c,bold"
setw -g window-status-format "#[fg=#e53935,bg=#1c1c1c]▎#[fg=#ffffff,bg=#1c1c1c,bold]#I:#W#[fg=#e53935]⚡ "
