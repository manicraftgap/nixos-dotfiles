# ==============================================================================
# 1. CORE ERGONOMIC SETTINGS & TERMINAL COLORS
# ==============================================================================
# Match Neovim 24-bit True Color and 256 colors
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"

# Change prefix key to Ctrl-a (easier on home row)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Quality of Life
set -g mouse on               # Mouse scrolling & pane selection support
set -g history-limit 10000    # Larger scrollback buffer
set -s escape-time 0          # Eliminate escape key delay (crucial for Vim users)
set -g focus-events on        # Pass focus events to Neovim
set -g clipboard on           # Enable system clipboard integration

# Start window and pane numbering at 1 (matches keyboard numbers 1-9)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on    # Automatically renumber windows when one is closed

# ==============================================================================
# 2. VIM PANE NAVIGATION & WINDOW SPLITS
# ==============================================================================
# Reload tmux config with 'Prefix + r'
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes using intuition (v = vertical split, s = horizontal split)
# Automatically retains current directory in new panes
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Navigate panes with Prefix + h/j/k/l (Vim motions)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Navigate panes without Prefix using Alt + h/j/k/l
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Fast Window Switching with Alt + 1-9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Resize panes with Prefix + Shift + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# 3. VIM COPY-MODE & SYSTEM CLIPBOARD INTEGRATION
# ==============================================================================
# Enable Vi keybindings in copy mode
set-window-option -g mode-keys vi

# Press 'Prefix + [' to enter copy mode
# Use 'v' to select text, 'y' to yank into clipboard
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Prevent mouse drag auto-exit (remains in copy mode after selection)
unbind -T copy-mode-vi MouseDragEnd1Pane

# ==============================================================================
# 4. COLOR THEME & STATUS BAR (MATCHING YOUR NEOVIM BASE16 PALETTE)
# ==============================================================================
# Color Map:
# base00 (Background):      #000000
# base01 (Panels/Status):   #0d0d0d
# base02 (Selection/Active):#1c1c1c
# base03 (Muted/Comments):  #666666
# base04/08/0E (Red Accent):#e53935
# base05/06 (Text):         #999999 / #ffffff

# Status Bar Layout
set -g status "on"
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#0d0d0d,fg=#999999"

# Pane Borders (Active pane highlighted in Red)
set -g pane-border-style "fg=#1c1c1c"
set -g pane-active-border-style "fg=#e53935"

# Left Status (Session Name in Bold Red)
set -g status-left-length "50"
set -g status-left "#[fg=#000000,bg=#e53935,bold] #S #[bg=#0d0d0d] "

# Right Status (Active Path & Host)
set -g status-right-length "80"
set -g status-right "#[fg=#666666,bg=#0d0d0d] #{pane_current_path} #[fg=#ffffff,bg=#1c1c1c] #H "

# Inactive Window Tab Styling
setw -g window-status-style "fg=#666666,bg=#0d0d0d"
setw -g window-status-format "#[fg=#666666,bg=#0d0d0d] #I:#W "

## ==============================================================================
# 5. WORKMAX (GIT WORKTREE MANAGER) INTEGRATION
# ==============================================================================

# Toggle Workmax Sidebar on the right
bind-key S run-shell "workm sidebar"

# Open Workmax Dashboard in a centered popup window
bind-key D display-popup -E -w 80% -h 80% "workm dashboard"

# Open Workmax Interactive Menu (Prefix + W)
bind-key w display-menu -T "#[fg=#e53935,bold] Workmax Actions " -x C -y C \
  "Add Worktree (New Branch)"  a "display-popup -E -w 50% -h 30% 'read -p \"Branch Name: \" b && workm add \$b'" \
  "Add Worktree (From Git)"   g "display-popup -E -w 70% -h 60% 'workm branch'" \
  "Open Dashboard"            d "display-popup -E -w 80% -h 80% 'workm dashboard'" \
  "Toggle Sidebar"            s "run-shell 'workm sidebar'" \
  "Sync Worktree Files"       r "run-shell 'workm sync files all && tmux display-message \"Worktree files synced!\"'" Active Window Tab Styling (Matches NeoTree / CursorLine selection style)
setw -g window-status-current-style "fg=#ffffff,bg=#1c1c1c,bold"
setw -g window-status-current-format "#[fg=#e53935,bg=#1c1c1c]▎#[fg=#ffffff,bg=#1c1c1c,bold]#I:#W#[fg=#e53935]⚡ "

# Message / Command Prompt Styling
set -g message-style "fg=#ffffff,bg=#1c1c1c,bold"
set -g message-command-style "fg=#ffffff,bg=#1c1c1c"

# Clock & Selection Highlight Styling
setw -g mode-style "fg=#ffffff,bg=#1c1c1c,bold"
set -g clock-mode-colour "#e53935"


